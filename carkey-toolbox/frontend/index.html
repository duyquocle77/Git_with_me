<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Key Toolbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">🔑 Car Key Toolbox</div>
    <input id="search" placeholder="Tìm tool..." />
    <nav id="tool-list"></nav>
    <div class="sidebar-footer">
      <button id="btn-reload" title="Nạp lại tools/*.py mà không restart">⟳ Reload tools</button>
      <button id="btn-restart" title="Khởi động lại Python worker">↻ Restart Python</button>
      <div id="worker-status" class="status">…</div>
    </div>
  </aside>

  <main>
    <section id="tool-panel">
      <div class="empty">Chọn một tool bên trái.</div>
    </section>

    <section id="runs">
      <div class="runs-header">
        <div id="run-tabs"></div>
        <button id="btn-clear" class="ghost">Xoá run đã xong</button>
      </div>
      <div id="run-view"><div class="empty">Chưa có run nào.</div></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
