<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Key Toolbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">🔑 Car Key Toolbox</div>
    <div id="tools-sidebar">
      <input id="search" placeholder="Search tools..." />
      <nav id="tool-list"></nav>
    </div>
    <div class="sidebar-footer">
      <button id="btn-reload" title="Reload tools/*.py without restarting">⟳ Reload tools</button>
      <button id="btn-restart" title="Restart the Python worker">↻ Restart Python</button>
      <div id="worker-status" class="status">…</div>
    </div>
  </aside>

  <main>
    <nav id="tabs">
      <button class="tab active" data-view="tools">🧰 Tools</button>
      <button class="tab" data-view="lab">🔌 Lab Control</button>
      <button class="tab" data-view="cicd">🏗 CI/CD</button>
    </nav>

    <div id="view-tools" class="view">
    <section id="tool-panel">
      <div class="empty">Select a tool on the left.</div>
    </section>

    <section id="runs">
      <div class="runs-header">
        <div id="run-tabs"></div>
        <button id="btn-clear" class="ghost">Clear finished</button>
      </div>
      <div id="run-view"><div class="empty">No runs yet.</div></div>
    </section>
    </div>

    <div id="view-lab" class="view hidden">
      <div class="lab-header">
        <span id="lab-config" class="muted"></span>
        <label class="poll"><input type="checkbox" id="lab-poll" checked /> Live status</label>
        <button id="btn-lab-reload" title="Re-read lab_config.json and reconnect drivers">⟳ Reload config</button>
      </div>
      <div id="lab-errors"></div>
      <div id="lab-grid"></div>
    </div>
    <div id="view-cicd" class="view hidden">
      <div class="ci-layout">
        <aside class="ci-panel">
          <div class="ci-card">
            <div class="ci-label">Pipeline</div>
            <select id="ci-pipeline"></select>
            <p id="ci-desc" class="ci-desc"></p>
          </div>
          <details class="ci-sec" open>
            <summary>📁 Paths <span id="ci-paths-badge" class="ci-badge"></span></summary>
            <div id="ci-paths"></div>
            <div id="ci-preview" class="ci-preview"></div>
            <div id="ci-saved" class="ci-saved"></div>
          </details>
          <details class="ci-sec" open>
            <summary>⚙️ Parameters</summary>
            <form id="ci-params" class="ci-form"></form>
          </details>
          <details class="ci-sec" open>
            <summary>🧩 Steps <span id="ci-steps-badge" class="ci-badge"></span></summary>
            <div id="ci-steps-select"></div>
          </details>
          <label class="switch-row"><input type="checkbox" id="ci-open" class="switch" checked /> Open release folder when done</label>
          <details class="ci-sec">
            <summary>🕘 History <span id="ci-history-badge" class="ci-badge"></span></summary>
            <div id="ci-history"></div>
          </details>
          <div class="ci-foot"><span id="ci-config"></span><button id="ci-reload" class="ghost" title="Re-read cicd_config.json">⟳</button></div>
        </aside>

        <section class="ci-main">
          <div id="ci-hero" class="ci-hero idle">
            <div class="ci-hero-info">
              <div class="ci-hero-title"><span id="ci-title">—</span><span id="ci-state" class="ci-status">Ready</span></div>
              <div class="ci-hero-sub"><span id="ci-elapsed">⏱ —</span><span id="ci-eta"></span><span id="ci-release" class="mono"></span></div>
            </div>
            <button id="ci-run" class="ci-run">▶ Run pipeline</button>
            <button id="ci-stop" class="ci-stop hidden">■ Stop</button>
          </div>
          <div class="ci-progress"><div id="ci-progress-bar"></div></div>
          <div id="ci-graph" class="ci-graph"></div>
          <div id="ci-result" class="ci-result hidden"></div>
          <div class="ci-logbox">
            <div class="ci-logbar">
              <span class="ci-label">Console</span>
              <div class="seg" id="ci-filter">
                <button data-filter="all" class="on">All</button>
                <button data-filter="error">Errors <b id="ci-err-count">0</b></button>
                <button data-filter="cmd">Commands</button>
              </div>
              <span class="spacer"></span>
              <label class="switch-row small"><input type="checkbox" id="ci-autoscroll" class="switch" checked /> Auto-scroll</label>
              <button id="ci-copy" class="ghost small" title="Copy log">⧉ Copy</button>
              <button id="ci-open-log" class="ghost small hidden">📄 pipeline.log</button>
            </div>
            <div id="ci-log" class="ci-log f-all"><div class="ci-log-empty">Press <b>Run pipeline</b> to start. Build output appears here.</div></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="modal" class="hidden"><div class="modal-box"><p id="modal-text"></p>
    <div class="actions"><button id="modal-cancel">Cancel</button><button id="modal-ok" class="danger">Confirm</button></div></div></div>

  <script src="app.js"></script>
  <script src="lab.js"></script>
  <script src="cicd.js"></script>
</body>
</html>
