<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Key Toolbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">🔑 Car Key Toolbox</div>
    <div id="tools-sidebar">
      <input id="search" placeholder="Search tools..." />
      <nav id="tool-list"></nav>
    </div>
    <div class="sidebar-footer">
      <button id="btn-reload" title="Reload tools/*.py without restarting">⟳ Reload tools</button>
      <button id="btn-restart" title="Restart the Python worker">↻ Restart Python</button>
      <div id="worker-status" class="status">…</div>
    </div>
  </aside>

  <main>
    <nav id="tabs">
      <button class="tab active" data-view="tools">🧰 Tools</button>
      <button class="tab" data-view="lab">🔌 Lab Control</button>
      <button class="tab" data-view="cicd">🏗 CI/CD</button>
    </nav>

    <div id="view-tools" class="view">
    <section id="tool-panel">
      <div class="empty">Select a tool on the left.</div>
    </section>

    <section id="runs">
      <div class="runs-header">
        <div id="run-tabs"></div>
        <button id="btn-clear" class="ghost">Clear finished</button>
      </div>
      <div id="run-view"><div class="empty">No runs yet.</div></div>
    </section>
    </div>

    <div id="view-lab" class="view hidden">
      <div class="lab-header">
        <span id="lab-config" class="muted"></span>
        <label class="poll"><input type="checkbox" id="lab-poll" checked /> Live status</label>
        <button id="btn-lab-reload" title="Re-read lab_config.json and reconnect drivers">⟳ Reload config</button>
      </div>
      <div id="lab-errors"></div>
      <div id="lab-grid"></div>
    </div>
    <div id="view-cicd" class="view hidden">
      <div class="ci-layout">
        <aside class="ci-panel">
          <label class="ci-field">Pipeline <select id="ci-pipeline"></select></label>
          <p id="ci-desc" class="muted"></p>
          <form id="ci-params" class="ci-params"></form>
          <div class="ci-sub">Steps</div>
          <div id="ci-steps-select"></div>
          <label class="poll"><input type="checkbox" id="ci-open" checked /> Open release folder when done</label>
          <div class="actions">
            <button id="ci-run" class="primary">▶ Run pipeline</button>
            <button id="ci-stop" class="danger hidden">■ Stop</button>
          </div>
          <div class="ci-sub">History</div>
          <div id="ci-history" class="ci-history"></div>
          <div class="ci-foot"><span id="ci-config" class="muted"></span>
            <button id="ci-reload" class="ghost" title="Re-read cicd_config.json">⟳</button></div>
        </aside>
        <section class="ci-main">
          <div class="ci-status">
            <span id="ci-state" class="chip">idle</span>
            <span id="ci-release" class="muted"></span>
            <button id="ci-open-dir" class="hidden">📂 Open release folder</button>
            <button id="ci-open-log" class="ghost hidden">📄 pipeline.log</button>
          </div>
          <ol id="ci-timeline" class="ci-timeline"></ol>
          <div id="ci-log" class="log ci-log"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="modal" class="hidden"><div class="modal-box"><p id="modal-text"></p>
    <div class="actions"><button id="modal-cancel">Cancel</button><button id="modal-ok" class="danger">Confirm</button></div></div></div>

  <script src="app.js"></script>
  <script src="lab.js"></script>
  <script src="cicd.js"></script>
</body>
</html>
